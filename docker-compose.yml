version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bijli_mitra_db
    environment:
      POSTGRES_USER: bijli_user
      POSTGRES_PASSWORD: bijli_password
      POSTGRES_DB: bijli_mitra_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bijli_mitra_backend
    environment:
      DATABASE_URL: postgresql://bijli_user:bijli_password@db:5432/bijli_mitra_db
      SECRET_KEY: bijli-mitra-secure-telangana-energy-key-2026
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bijli_mitra_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
